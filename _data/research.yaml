title: Research
description: |
  We experience the world through the connection between what we do and what we sense. Moving a hand, touching a surface, or playing an instrument changes the feedback we receive—and how the world feels.

  We study these sensorimotor relationships and use them to design interactive technology. Our work combines experiments on perception and action with new ways of sensing movement, creating tactile feedback, and integrating devices with the body.
topics:
  - title: Understanding perception
    image_fit: contain
    style: bg-si-gray
    image: uploads/images/research/understanding-perception.svg
    image_alt: "Three finger trajectories from our texture research, with individual strokes marked in colour"
    description: |
      Perception is something we do. To feel a surface, we move our fingers, change how hard we press, and adjust our speed. These actions change the sensory information we receive, which in turn guides our next movement.

      We use touch to study this continuous exchange between action and sensation. By measuring how people explore textures and manipulating the feedback they receive, we investigate how movement, physical signals and expectations come together to create experiences of roughness, softness and resistance.

      Our experiments combine precise measurements with people's reports of what they feel. This helps us understand human perception and design interactive systems that work with the way our bodies sense and act.

  - title: Sensorimotor Augmentation
    style: bg-si-purple
    image: uploads/images/background_01.jpg
    description: |
      Touch is active. When a finger moves across wood, the vibrations it creates help us feel the surface. By measuring movement and adapting tactile feedback in response, we can change how virtual and physical objects feel.

      We investigate how this relationship can create experiences of texture, force, and connected materials. We also explore whether feedback can extend perception, and how it affects the feeling of controlling our own actions.

      Recent examples include <a href="publications.html#ConnectedMaterialExperiencesusingBimanualVibrotactileCrosstalkinVirtualReality">bimanual material experiences in VR</a> and <a href="https://shunichikasahara.com/portfolio/faster-than-muscle/">Faster Than Muscle</a>. Earlier foundations include <a href="https://hci.cs.uni-saarland.de/research/barefoot/">bARefoot</a> and Paul's <a href="https://youtu.be/QeZu4PI8nsI">SIGCHI dissertation award talk</a>.

  - title: Body Integrated Systems
    style: bg-si-pink
    image: uploads/images/background_03.jpg
    description: |
      Wearable technology can do more than put a screen or a tracker on the body. Devices that closely connect sensing and feedback can become part of how we move, express ourselves, and interact with our surroundings.

      We investigate how information can be communicated through the body, how devices can fit comfortably into everyday movement, and when a technology feels like an extension of ourselves. This brings together physical design with questions about perception, control, and agency.

      Examples include <a href="publications.html#SensorimotorDevicesCouplingSensingandActuationtoAugmentBodilyExperience">Sensorimotor Devices</a> and <a href="https://skillsleeves.github.io/">SkillSleeves</a>.

  - title: New Materials, Sensors & Actuators
    style: bg-si-gray
    image: uploads/images/background_05.jpg
    description: |
      New interactions need suitable materials and hardware: sensors that capture subtle movements, actuators that create carefully timed feedback, and soft electronics that move with the body. We develop these building blocks alongside the experiences they enable.

      Craft remains central to this work. Textile and material practices offer ways to make devices that are adaptable, repairable, and personally meaningful. Sharing accessible fabrication methods also helps more people experiment with interactive materials.

      Examples include our <a href="https://doi.org/10.1002/adfm.76802">all-textile movement sensor</a> and <a href="https://counterchemists.github.io/">PolySense</a>.
