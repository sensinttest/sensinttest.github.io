title: Sensorimotor Interaction Group
description: |
  The <strong>Sensorimotor Interaction Group (senSInt)</strong> at the <a href="https://www.mpi-inf.mpg.de/">Max Planck Institute for Informatics</a> investigates how human perception and action shape our experience of the   world, and how this understanding can inform the design of interactive   technologies.

  Led by <a href="https://people.mpi-inf.mpg.de/~pastrohm/">Paul Strohmeier</a>, our research combines human-computer interaction, perceptual science, and engineering. We study how people perceive and act through their bodies, and develop interactive systems that enable new ways of experiencing ourselves, engaging with the physical world, and   interacting with technology.

  Our work spans <strong>haptic rendering, sensorimotor augmentation, embodied interaction, and on-body systems</strong>.

  We share research facilities with the <a href="https://hci.cs.uni-saarland.de/">HCI Lab</a>   at Saarland University.

  <img src="uploads/images/news/senSInt_saarschleife.jpeg" alt="The senSInt group at the Saarschleife" width="600" height="338" class="img-fluid">
  senSInt at the Saarschleife. Left to right: Fariborz, Sara, Easa, Valentin, Yuran, Gaby, Wiam, Paul and Reshma.
  
