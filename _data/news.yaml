title: News
description: Research, people, events, and updates from senSInt.

news: 
  - id: 33
    title: "Faster Than Muscle accepted at SIGGRAPH Asia"
    date: 2026-10-09
    content: |
      Our paper <a href="https://shunichikasahara.com/portfolio/faster-than-muscle/"><b>Faster Than Muscle</b></a> has also been accepted as a Demonstration at <a href="https://asia.siggraph.org/2026/"><b>SIGGRAPH Asia 2026</b></a> in Kuala Lumpur, Malaysia! The work explores how muscle signals can be used to execute actions faster than the human body, and how this affects our sense of agency.
  - id: 31
    title: "Paul invited to the SIGCHI Futures Summit"
    date: 2026-10-09
    content: |
      <b>Paul Strohmeier</b> has been invited to participate in the <a href="https://sigchi.org/news/announcements/"><b>SIGCHI Futures Summit 2026</b></a> in Paris, November 16–18, to discuss the future of SIGCHI and its conference communities.
  - id: 32
    images:
      - path: uploads/images/news/senSInt_saarschleife.jpeg
        alt: "At the Saarschleife. Left to right: Fariborz, Sara, Easa, Valentin, Yuran, Gaby, Wiam, Paul and Reshma."
        caption: "At the Saarschleife. Left to right: Fariborz, Sara, Easa, Valentin, Yuran, Gaby, Wiam, Paul and Reshma."
    title: "A group retreat at the Saarschleife"
    date: 2026-09-29
    content: |
      The <b>Sensorimotor Interaction Group</b> went on a retreat to the <b>Saarschleife</b>! We spent the day discussing our research, exchanging ideas, and exploring future directions for the group.
  - id: 30
    title: "Easa to co-chair papers at Augmented Humans 2027"
    date: 2026-08-30
    content: |
      <b>Easa AliAbbasi</b> has been appointed <b>Paper Co-Chair</b> of <a href="https://augmented-humans.org/committee/">Augmented Humans 2027</a>, taking place in Colombo, Sri Lanka, in March 2027!
  - id: 29
    title: "Paul to co-chair NIME 2027 in Paris"
    date: 2026-08-08
    content: |
      <b>Paul Strohmeier</b> will co-chair <a href="https://forum.nime.org/t/announcing-nime-2027/1099"><b>NIME 2027</b></a> in Paris, together with Sofy Yuditskaya and Xiao Xiao. The conference theme is "Sensorial Symbiosis: Bodies, Machines, and Time".
  - id: 28
    title: "Faster Than Muscle accepted at UIST"
    date: 2026-08-01
    content: |
      Our paper <a href="https://shunichikasahara.com/portfolio/faster-than-muscle/"><b>Faster Than Muscle</b></a> has been accepted at UIST 2026! The work explores how voluntary muscle signals can be used to execute actions faster than the human body, and how this affects our sense of agency.
