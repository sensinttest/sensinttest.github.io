    title: "Student-built instruments on stage in Saarbrücken"
    date: 2026-07-17
    content: |
      Students from our <b>Audio Devices: Synthesis, Control & Performance</b> course presented their self-built electronic musical instruments and performed live at the <a href="https://www.uni-saarland.de/en/news/oeffentliche-praesentation-und-konzert-new-instruments-for-musical-expression-49594.html">Nacht der Schönen Künste</a> in Saarbrücken! See the <a href="https://sensint.mpi-inf.mpg.de/instruments.html">instruments</a>.
  - id: 26
    gallery_layout: lead-pair
    images:
      - path: uploads/images/news/testing_the_cap_sensor_on_courtney___singingAugmentationSystem.jpg
        alt: "Valentin and Rachel testing the sensor on Courtney."
        caption: "Valentin and Rachel testing the sensor on Courtney."
      - path: uploads/images/news/measuringRig.jpg
        alt: "The sensor measuring rig."
      - path: uploads/images/news/easa_demonstrating_the_sensor.jpg
        alt: "Easa demonstrating the textile sensor."
        row_caption: "Left: the measuring rig. Right: Easa demonstrating the all-textile sensor."
    title: "A textile sensor for subtle body movements"
    date: 2026-07-14
    content: |
      Our paper <a href="https://doi.org/10.1002/adfm.76802"><b>An All-Textile, Mechano-Capacitive Subtle Movement Sensor</b></a>, by <b>Easa AliAbbasi, Rachel Freire, Valentin Martinez-Missir, Lakshmi Vineetha Rallabandi, and Paul Strohmeier</b>, has been published in <b>Advanced Functional Materials</b>! The work introduces a robust, high-precision textile sensor capable of detecting subtle bodily movements, including breathing.
  - id: 25
    title: "HapticCompass is a EuroHaptics demo award finalist"
    date: 2026-07-09
    content: |
      <b>Wanhui Li, Easa AliAbbasi, and Paul Strohmeier</b>'s <b>HapticCompass</b> was selected as a finalist for the <a href="https://eurohaptics.org/ehc2026/awards/"><b>Best Demo Award at EuroHaptics 2026</b></a> in Siena, Italy!
  - id: 24
    gallery_layout: pair
    gallery_caption: "CHI 2026 Best Paper Awards for Scene2Hap (left) and How are Vibrotactile Experiences Visually Represented? (right)."
    images:
      - path: uploads/images/news/bestPaperAwards_barcelona_scene2hap.jpg
        alt: "Scene2Hap — CHI 2026 Best Paper Award."
      - path: uploads/images/news/bestPaperAward_barcelona_hapticRepresentations.jpg
        alt: "Visual representations of vibrotactile experiences — CHI 2026 Best Paper Award."
    title: "Two Best Paper Awards at CHI 2026"
    date: 2026-04-14
    content: |
      We received <a href="https://www.mpi-inf.mpg.de/news/detail/two-best-paper-awards-at-the-worlds-largest-conference-on-human-computer-interaction"><b>two Best Paper Awards at CHI 2026</b></a>! Congratulations to <b>Easa AliAbbasi</b> and <b>Dennis Wittchen</b> and all collaborators for their work on Scene2Hap and the visual representation of vibrotactile experiences.
  - id: 23
    title: "Congratulations to Dr. Yuran Ding"
    date: 2026-03-23
    content: |
      Congratulations to <b>Yuran Ding</b> on successfully defending her <a href="https://talks.cs.umd.edu/talks/4529"><b>PhD thesis</b></a> "Mediating Complexity: Reasoning Layers from Embodied Interaction to Agentic Systems" at the University of Maryland!
  - id: 22
    title: "Co-chairing Augmented Humans 2026 in Okinawa"
    date: 2026-03-16
    content: |
      <b>Paul Strohmeier</b> co-chaired <a href="https://2026.augmented-humans.org/committee/"><b>Augmented Humans 2026</b></a> in Okinawa, Japan, together with Kouta Minamizawa, Shunichi Kasahara, and Yomna Abdelrahman.
  - id: 21
    text_first: true
    images:
      - path: uploads/images/news/celebratingNiharsDefense.jpg
        alt: "Celebrating Nihar’s successful PhD defence at Brauhaus zum Stiefel."
        caption: "Afterwards, we went to Brauhaus zum Stiefel to celebrate."
    title: "Congratulations to Dr. Nihar Sabnis"
    date: 2026-03-09
    content: |
      Congratulations to <b>Nihar Sabnis</b> on successfully defending his <a href="https://www.mpi-inf.mpg.de/news/detail/nihar-sabnis-receives-phd"><b>PhD thesis</b></a> "Re-envisioning Touch: Designing Embodied Material and Force Experiences with Motion-Coupled Vibrotactile Feedback" at Saarland University, receiving the distinction <b>summa cum laude</b>!
  - id: 20
    title: "Yuran receives an NSF Graduate Research Fellowship"
