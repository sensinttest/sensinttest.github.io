title: News
description: 

news: 
  - id: 30
    date: 2026-10-09
    content: |
      <b>Paul Strohmeier</b> has been invited to participate in the <a href="https://sigchi.org/news/announcements/"><b>SIGCHI Futures Summit 2026</b></a> in Paris, November 16–18, to discuss the future of SIGCHI and its conference communities.
  - id: 29
    date: 2026-09-29
    content: |
      The <b>Sensorimotor Interaction Group</b> went on a retreat to the <b>Saarschleife</b>! We spent the day discussing our research, exchanging ideas, and exploring future directions for the group.
  - id: 28
    date: 2026-10-08
    content: |
      <b>Paul Strohmeier</b> will co-chair <a href="https://forum.nime.org/t/announcing-nime-2027/1099"><b>NIME 2027</b></a> in Paris, together with Sofy Yuditskaya and Xiao Xiao. The conference theme is "Sensorial Symbiosis: Bodies, Machines, and Time".
  - id: 27
    date: 2026-10-04
    content: |
      Our paper <a href="https://shunichikasahara.com/portfolio/faster-than-muscle/"><b>Faster Than Muscle</b></a> has been accepted at UIST 2026! The work explores how voluntary muscle signals can be used to execute actions faster than the human body, and how this affects our sense of agency.
  - id: 26
    date: 2026-07-17
    content: |
      Students from our <b>Audio Devices: Synthesis, Control & Performance</b> course presented their self-built electronic musical instruments and performed live at the <a href="https://www.uni-saarland.de/en/news/oeffentliche-praesentation-und-konzert-new-instruments-for-musical-expression-49594.html">Nacht der Schönen Künste</a> in Saarbrücken! See the <a href="https://sensint.mpi-inf.mpg.de/instruments.html">instruments</a>.
  - id: 25
    date: 2026-07-09
    content: |
      <b>Wanhui Li, Easa AliAbbasi, and Paul Strohmeier</b>'s <b>HapticCompass</b> was selected as a finalist for the <a href="https://eurohaptics.org/ehc2026/awards/"><b>Best Demo Award at EuroHaptics 2026</b></a> in Siena, Italy!
  - id: 24
    date: 2026-04-14
    content: |
      We received <a href="https://www.mpi-inf.mpg.de/news/detail/two-best-paper-awards-at-the-worlds-largest-conference-on-human-computer-interaction"><b>two Best Paper Awards at CHI 2026</b></a>! Congratulations to <b>Easa AliAbbasi</b> and <b>Dennis Wittchen</b> and all collaborators for their work on Scene2Hap and the visual representation of vibrotactile experiences.
  - id: 23
    date: 2026-03-23
    content: |
      Congratulations to <b>Yuran Ding</b> on successfully defending her <a href="https://talks.cs.umd.edu/talks/4529"><b>PhD thesis</b></a> "Mediating Complexity: Reasoning Layers from Embodied Interaction to Agentic Systems" at the University of Maryland!
  - id: 22
    date: 2026-03-16
    content: |
      <b>Paul Strohmeier</b> co-chaired <a href="https://2026.augmented-humans.org/committee/"><b>Augmented Humans 2026</b></a> in Okinawa, Japan, together with Kouta Minamizawa, Shunichi Kasahara, and Yomna Abdelrahman.
  - id: 21
    date: 2026-03-09
    content: |
      Congratulations to <b>Nihar Sabnis</b> on successfully defending his <a href="https://www.mpi-inf.mpg.de/news/detail/nihar-sabnis-receives-phd"><b>PhD thesis</b></a> "Re-envisioning Touch: Designing Embodied Material and Force Experiences with Motion-Coupled Vibrotactile Feedback" at Saarland University, receiving the distinction <b>cum laude</b>!
  - id: 20
    date: 2025-07-07
    content: |
      Congratulations to <b>Yuran Ding</b> on receiving a prestigious <a href="https://www.cs.umd.edu/node/26872"><b>NSF Graduate Research Fellowship</b></a>! The fellowship supports outstanding graduate researchers with three years of funding.
  - id: 19
    date: 2025-06-12
    content: |
      <b>Easa AliAbbasi</b> gave a talk at CG Lunch, 
  - id: 18
    date: 2025-06-12
    content: |
      <b>Wanhui Li</b> is a visiting PhD student from the University of Tokyo
  - id: 17
    date: 2024-10-01
    content: |
      Paul received an <b>ERC Starting Grant</b>, supporting senSInt research with 1.5 million Euro. 
  - id: 16
    date: 2024-07-01
    content: |
      We presented three demos at <b>Eurohaptics</b> 2024 in Lille!
  - id: 15
    date: 2024-05-01
    content: |
      <b>Yuran Ding</b> gave a talk to undergraduates at UNIST.
  - id: 14
    date: 2024-03-01
    content: |
      The group attended TEI 2024 and presented 1 paper, 2 WIP, 1 performance, and 1 workshop!
  - id: 13
    date: 2024-04-15
    content: |
      We hosted German Pre-CHI in April 2024 in collaboration with the HCI Lab.
  - id: 12
    date: 2024-04-01
    content: |
      <b>Nihar Sabnis</b> gave a talk at Austrian Institute of Technology.
  - id: 11
    date: 2024-05-01
    content: |
      <b>Paul Strohmeier</b> and <b>Nihar Sabnis</b> gave talks at Goldsmiths (hosted by Yoram Chisik) and Kings College (hosted by Andrew MacPherson) in the UK.
  - id: 10
    date: 2024-01-31
    content: |
      <b>Nihar Sabnis</b> conducted three workshops at IIT Jodhpur in December 2023 and January 2024.
  - id: 9
    date: 2024-05-01
    content: |
      <b>Gabriela Vega</b> got accepted as a Fellow to attend the 10th Heidelberg Laureate Forum. She also won a Travel Award to attend UBICOMP/ISWC 2024 in Cancun, Mexico!
  - id: 8
    date: 2023-06-01
    content: |
      We are having an exciting research summer. <b>Yuran Ding</b> is joining as a PhD student, <b>Rachel Freire</b> is joining to work on new wearable interactive garment interfaces, and <b>Konrad Fabian</b> will be applying his experience in generative modeling to our projects.
  - id: 7
    date: 2023-05-01
    content: |
      We published 3 papers at CHI '23. Our Haptic Servo paper was awarded an Honourable Mention.
  - id: 6
    date: 2022-05-01
    content: |
      The senSInt team co-hosted the <a href="https://tactilevision.github.io/chi2022-sustainablehapticdesign/"> Sustainable Haptic Design </a> Workshop at CHI this year. Exciting keynote talks by Eric Vezzoli, Vincent Levesque, & Hasti Seifi. 
  - id: 5
    date: 2022-03-18
    content: |
      Courtney and Paul did a live music improvisation at the in person satellite event of this years Augmented Humans conference. You can watch and listen on <a href="https://youtu.be/LTO-U2OgIAQ"> YouTube </a>
      
  - id: 4
    date: 2021-11-19
    content: |
      Paul presented the research work of senSInt at MIT, invited by Hiroshi Ishii. A video of his talk is on <a href="https://youtu.be/rVTM6XPphEM"> YouTube </a>
  - id: 3
    date: 2021-09-21
    content: |
      Paul has been invited to present at the <a href="https://symposium.ahlab.org/">Assistive Augmentation Symposium</a>. You can watch his talk on <a href=" https://youtu.be/Sq2hrzHWcko">YouTube </a>
      
  - id: 2
    date: 2021-08-01
    content: |
      Over the course of the next months, <b>Courtney Reed</b> <i>(PostDoc)</i>, <b>Nihar Sabnis</b> <i>(PhD Student)</i>, and <b>Dennis Wittchen</b> <i>(Visiting Researcher)</i> will be joining senSInt.
  - id: 1
    date: 2021-07-01
    content: |
      The Sensiromotor Interaction group joins the Max Planck Insitute for Informatics.
